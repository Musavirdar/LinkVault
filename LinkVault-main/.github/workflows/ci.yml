name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore Backend Dependencies
        run: dotnet restore sharedb1.sln

      - name: Build Solution
        run: dotnet build sharedb1.sln --configuration Release --no-restore

      - name: Run Security & Integration Tests
        run: dotnet test backend/LinkVaultApi.Tests/LinkVaultApi.Tests.csproj --configuration Release --no-build --verbosity normal

  frontend-build:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"
          cache-dependency-path: app/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: app
        run: npm ci

      - name: Build Frontend Application
        working-directory: app
        run: npm run build
